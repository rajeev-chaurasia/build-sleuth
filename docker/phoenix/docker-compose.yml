services:
  phoenix:
    # Pin a concrete tag before relying on this for anything but local runs.
    image: arizephoenix/phoenix:latest
    container_name: buildsleuth-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006" # UI and OTLP HTTP collector (POST /v1/traces)
      - "4317:4317" # OTLP gRPC collector
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_PORT: "6006"
      PHOENIX_GRPC_PORT: "4317"
    volumes:
      - phoenix-data:/mnt/data

volumes:
  phoenix-data:
