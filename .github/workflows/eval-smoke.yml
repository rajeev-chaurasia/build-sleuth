name: eval-smoke

# Guards against silent quality regressions: any change to prompts, agent
# code, or the dataset must show its effect on the scorecard before merging.
on:
  pull_request:
    paths:
      - "src/buildsleuth/**"
      - "evals/**"
      - "dataset/**"
      - ".github/workflows/eval-smoke.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    # Never expose model credentials to a pull request from a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-groups

      - name: Check dataset manifest is current
        run: uv run buildsleuth dataset --check

      # No credentials are available on a pull request, so this is the keyless
      # regex baseline. results/baseline.json has to name a scorecard for the
      # same model, or the comparison measures the gap between two models
      # instead of what this revision changed.
      - name: Score this revision
        run: uv run python -m evals.run_eval --model baseline-regex --save --results results/current

      - name: Compare against baseline
        id: compare
        # pipefail matters: without it the pipeline reports tee's status and
        # the gate's non-zero exit is silently discarded.
        shell: bash
        run: |
          set -euo pipefail
          current=$(ls results/current/*.json | head -1)
          if [ ! -s results/baseline.json ]; then
            echo "no baseline recorded yet, skipping the gate" | tee comparison.md
            exit 0
          fi
          baseline=$(cat results/baseline.json)
          # A pointer at a scorecard nobody committed used to skip the gate,
          # which turned a typo into a silently disabled gate. It fails now.
          if [ ! -f "results/$baseline" ]; then
            echo "baseline pointer names an uncommitted scorecard: $baseline" | tee comparison.md
            exit 1
          fi
          uv run python -m evals.diff_baseline \
            --baseline "results/$baseline" --current "$current" | tee comparison.md

      - name: Comment the scorecard diff
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('comparison.md')) return;
            const body = '## Eval scorecard\n\n' + fs.readFileSync('comparison.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
