name: import-bugswarm

# Importing an artifact means pulling a multi gigabyte image of a whole Travis
# environment. Doing that on a laptop fills the disk and starves the host, so
# it happens here instead, where the disk is disposable and one artifact gets
# one runner.
#
# Run it from the Actions tab, or:
#   gh workflow run import-bugswarm.yml -f tags=owner-repo-123,owner2-repo2-456

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma separated BugSwarm image tags"
        required: true
      start_id:
        description: "First case number, so ids do not collide with existing ones"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - id: split
        # One tag per runner. Two artifacts on one disk is how this fails.
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ["TAGS"]
          start = int(os.environ["START_ID"] or 2)
          tags = [t.strip() for t in raw.split(",") if t.strip()]
          entries = [
              {"tag": t, "case_id": f"bs-{start + i:04d}", "number": start + i}
              for i, t in enumerate(tags)
          ]
          print("matrix=" + json.dumps({"include": entries}))
          EOF
        env:
          TAGS: ${{ inputs.tags }}
          START_ID: ${{ inputs.start_id }}

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The runner ships with toolchains this job never uses, and an
        # artifact image will not fit alongside them.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-groups

      - name: Import ${{ matrix.tag }}
        run: |
          rm -rf dataset/cases/bugswarm
          uv run python scripts/import_bugswarm.py \
            --tags "${{ matrix.tag }}" \
            --start-id "${{ matrix.number }}"
          ls dataset/cases/bugswarm/${{ matrix.case_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: case-${{ matrix.case_id }}
          path: dataset/cases/bugswarm/${{ matrix.case_id }}
          if-no-files-found: error

  collect:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: case-*

      - name: Place the imported cases
        run: |
          mkdir -p dataset/cases/bugswarm
          for dir in incoming/case-*; do
            [ -d "$dir" ] || continue
            id=$(basename "$dir" | sed 's/^case-//')
            rm -rf "dataset/cases/bugswarm/$id"
            cp -r "$dir" "dataset/cases/bugswarm/$id"
          done
          rm -rf incoming
          ls dataset/cases/bugswarm

      - name: Validate and refresh the manifest
        run: |
          uv sync --all-groups
          uv run python scripts/validate_dataset.py

      - name: Push the new cases to a branch
        # A branch rather than a push to main, because a case nobody has
        # looked at should not land in the benchmark unreviewed. A branch
        # rather than the pull request API, because opening one needs the
        # repository to let Actions create pull requests, and turning that
        # on everywhere to save one click is a bad trade.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add dataset/cases/bugswarm dataset/manifest.json
          git diff --cached --quiet && echo "nothing imported" && exit 0
          git commit -m "dataset: import BugSwarm artifacts as executable cases"
          git push -f origin "$BRANCH"
          {
            echo "### Imported cases pushed to \`$BRANCH\`"
            echo
            echo "[Open a pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1)"
            echo
            echo "Culprit files come from the maintainer's own fix. The"
            echo "subcategory on each is a default and has not been adjudicated."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BRANCH: dataset/bugswarm-import
