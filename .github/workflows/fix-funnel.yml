name: fix-funnel

# Measures how far proposed patches actually get, by applying each one inside
# the artifact image and rerunning the build that failed.
#
# It runs here rather than on a laptop for the same reason the imports do:
# each image is gigabytes, and two of them will not fit on one disk. One case
# gets one runner, and the funnel is assembled at the end.
#
# Needs a model key in a repository secret. Which one depends on the model:
# BUILDSLEUTH_GEMINI_API_KEY, BUILDSLEUTH_GROQ_API_KEY, or
# BUILDSLEUTH_OPENROUTER_API_KEY. All three are passed through, and the
# provider comes from the model in the registry.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to measure"
        required: false
        default: "gemini-3.1-flash-lite"
      control:
        description: "Recheck the verifier against the maintainer fixes"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - id: pick
        # The case list comes from the dataset, so adding cases widens the
        # matrix without anybody editing this file.
        run: |
          uv sync --all-groups
          uv run python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from buildsleuth.dataset.loader import load_cases
          from evals.fix_funnel import executable_cases, unmeasurable_cases

          cases = executable_cases(load_cases(Path("dataset")))
          # A case whose own reference fix does not pass cannot measure a
          # patch, so it does not get a runner unless the control is being
          # rechecked.
          if os.environ["CONTROL"] != "true":
              broken = unmeasurable_cases()
              cases = [c for c in cases if c.case_id not in broken]
          print("matrix=" + json.dumps({"include": [{"case_id": c.case_id} for c in cases]}))
          print(f"count={len(cases)}")
          EOF
        env:
          CONTROL: ${{ inputs.control }}

  measure:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # Job level rather than step level, because a step cannot read its own
      # step-level env in its `if`.
      BUILDSLEUTH_GEMINI_API_KEY: ${{ secrets.BUILDSLEUTH_GEMINI_API_KEY }}
      BUILDSLEUTH_GROQ_API_KEY: ${{ secrets.BUILDSLEUTH_GROQ_API_KEY }}
      BUILDSLEUTH_OPENROUTER_API_KEY: ${{ secrets.BUILDSLEUTH_OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-groups

      - name: Control for ${{ matrix.case_id }}
        # Runs the maintainer's own fix, and a corrupted copy of it, through
        # the same verifier. Without this a funnel of zeros cannot distinguish
        # a model that writes bad patches from a verifier that cannot
        # recognise a good one. No model is involved, so it runs first.
        #
        # Off by default: the answer is committed in results, and rerunning it
        # doubles the container time on every case.
        if: inputs.control == 'true'
        run: |
          uv run python -m evals.verifier_control \
            --only "${{ matrix.case_id }}" \
            --out "control/${{ matrix.case_id }}.json"

      - name: Measure ${{ matrix.case_id }}
        # The key check is in bash rather than a step `if`, because the env
        # context did not resolve the secret there and the step silently
        # skipped on every case even with the secret set.
        run: |
          if [ -z "$BUILDSLEUTH_GEMINI_API_KEY" ] && [ -z "$BUILDSLEUTH_OPENROUTER_API_KEY" ]; then
            echo "no model key configured, control only"
            exit 0
          fi
          uv run python -m evals.fix_funnel \
            --model "${{ inputs.model }}" \
            --only "${{ matrix.case_id }}" \
            --out "attempts/${{ matrix.case_id }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attempt-${{ matrix.case_id }}
          path: |
            attempts/${{ matrix.case_id }}.json
            control/${{ matrix.case_id }}.json
          if-no-files-found: warn

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: attempts
          pattern: attempt-*

      - name: Assemble the funnel
        # A case whose runner died is missing from the artifacts entirely, so
        # the count here is the honest denominator rather than the planned one.
        run: |
          uv sync --all-groups
          uv run python -m evals.verifier_control --summarize attempts | tee control.txt
          uv run python -m evals.fix_funnel \
            --aggregate attempts --out results/fix-funnel.json | tee funnel.txt || true
          if ! grep -q attempted funnel.txt; then
            # A run that measured nothing once finished green, because every
            # measure step skipped on a missing key and said so quietly.
            echo "::warning::no patches were measured, check the model key secret"
          fi
          {
            echo '### Verifier control'
            echo
            echo 'The maintainer fix and a corrupted copy, through the same checks.'
            echo '```'
            cat control.txt
            echo '```'
            echo
            echo '### Fix funnel'
            echo
            echo '```'
            cat funnel.txt
            echo '```'
            echo
            echo "Planned ${{ needs.plan.outputs.count }} cases."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fix-funnel
          path: results/fix-funnel.json
