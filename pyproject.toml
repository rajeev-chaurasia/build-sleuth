[project]
name = "buildsleuth"
version = "0.1.0"
description = "CI failure triage agent: classifies failing GitHub Actions runs, localizes root cause, and proposes verified fixes. AI proposes, deterministic checks verify."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rajeev Chaurasia", email = "Rajeevchaurasia.dev@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
buildsleuth = "buildsleuth.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildsleuth"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "evals", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live tests against real services, excluded by default",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/buildsleuth", "evals"]
branch = true

[tool.coverage.report]
# Set to the level already reached rather than an aspiration, so the number
# can only be raised deliberately and never drifts down unnoticed.
fail_under = 90
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
